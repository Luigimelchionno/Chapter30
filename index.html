 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}

.frame{position:absolute;left:50%;top:50%;width:min(100vw,66.667vh);aspect-ratio:2/3;transform:translate(-50%,-50%);overflow:hidden}
@supports (height:1dvh){.frame{width:min(100vw,66.667dvh)}}
@media (max-aspect-ratio:11/20){.frame{width:max(100vw,66.667vh);overflow:visible}}
@supports (height:1dvh){@media (max-aspect-ratio:11/20){.frame{width:max(100vw,66.667dvh)}}}
.layer{position:absolute;inset:0;background:var(--img) center/100% 100% no-repeat}
.dim{filter:brightness(.1) saturate(.6)}
.lit{opacity:0;-webkit-mask-image:linear-gradient(#000 0,#000 33.3%,transparent 66.6%,transparent 100%);mask-image:linear-gradient(#000 0,#000 33.3%,transparent 66.6%,transparent 100%);
 -webkit-mask-size:100% 300%;mask-size:100% 300%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:0 100%;mask-position:0 100%}
body.open .lit{opacity:1;animation:reveal 5.5s cubic-bezier(.45,.05,.4,1) 1.2s forwards}
@keyframes reveal{to{-webkit-mask-position:0 0;mask-position:0 0}}

.fx{position:absolute;pointer-events:none;mix-blend-mode:screen;opacity:0}
/* insegna neon in alto a destra */
.signcover{position:absolute;left:83%;top:0;width:17%;height:25%;opacity:0;background:radial-gradient(ellipse at 55% 48%,#080504 38%,rgba(8,5,4,.9) 52%,transparent 75%)}
body.open .signcover{opacity:1;animation:signon 2.4s linear 4.2s forwards}
@keyframes signon{0%{opacity:1}6%{opacity:.15}12%{opacity:.9}18%{opacity:.1}26%{opacity:.7}34%{opacity:0}42%{opacity:.45}50%,100%{opacity:0}}
.sglow{left:70%;top:-5%;width:44%;height:32%;background:radial-gradient(ellipse,rgba(255,130,50,.5),transparent 68%)}
body.open .sglow{animation:buzz 5s linear 6.4s infinite}
@keyframes buzz{0%,100%{opacity:.55}44%{opacity:.55}46%{opacity:.15}48%{opacity:.6}70%{opacity:.5}72%{opacity:.2}74%{opacity:.6}}
/* tubo neon a sinistra */
.tube{left:3%;top:0;width:9%;height:50%;background:linear-gradient(90deg,transparent,rgba(255,150,60,.55),transparent);filter:blur(6px)}
body.open .tube{animation:breathe 3.6s ease-in-out 3s infinite}
@keyframes breathe{0%,100%{opacity:.15}50%{opacity:.75}}
/* candela */
.candle{left:-9%;top:73%;width:26%;height:22%;background:radial-gradient(ellipse,rgba(255,170,80,.55),transparent 68%)}
body.open .candle{animation:flame 2.3s ease-in-out 4s infinite}
@keyframes flame{0%,100%{opacity:.3;transform:scale(1)}20%{opacity:.7;transform:scale(1.06)}45%{opacity:.4}65%{opacity:.8;transform:scale(1.03)}85%{opacity:.35}}
/* nome LUIGI */
.name{left:18%;top:25%;width:64%;height:13%;background:radial-gradient(ellipse,rgba(255,170,90,.38),transparent 68%)}
body.open .name{animation:breathe 4.2s ease-in-out 4.5s infinite}
/* riflesso sulla card */
.cardbox{position:absolute;left:18%;top:11.7%;width:63.5%;height:72%;overflow:hidden;pointer-events:none}
.sheen{position:absolute;inset:-10% 0;mix-blend-mode:screen;transform:translateX(-130%) skewX(-18deg);width:45%;background:linear-gradient(90deg,transparent,rgba(255,205,150,.2),transparent)}
body.open .sheen{animation:sheen 3s ease-in-out 6.8s 1 forwards,sheen 3s ease-in-out 14s infinite}
@keyframes sheen{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(330%) skewX(-18deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ingresso */
.gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;background:none;width:100%;-webkit-tap-highlight-color:transparent}
.panel{position:absolute;top:0;bottom:0;width:50%;background:var(--bg);transition:transform 1.3s cubic-bezier(.7,0,.2,1) .3s}
.panel.l{left:0;border-right:1px solid #a67c4e;box-shadow:1px 0 10px rgba(242,196,143,.35)}.panel.r{right:0}
.seal{position:relative;z-index:2;text-align:center;transition:opacity .5s,transform .8s}
.who{font-family:var(--script);font-size:30px;color:#f6e6d2;margin-bottom:4px}
.n30{font-family:var(--serif);font-size:min(34vw,170px);line-height:1;color:#ffe3c2;
 text-shadow:0 0 6px #ffb26b,0 0 22px var(--ember),0 0 60px var(--ember),0 0 110px #c4511a;animation:fl 4.5s infinite}
.hint{margin-top:20px;letter-spacing:.38em;font:500 13px var(--serif);text-transform:uppercase;color:var(--gold);animation:pl 2.2s ease-in-out infinite}
@keyframes fl{0%,18%,22%,62%,66%,100%{opacity:1}20%,64%{opacity:.35}21%{opacity:.9}65%{opacity:.6}}
@keyframes pl{50%{opacity:.35}}
body.open .seal{opacity:0;transform:scale(1.15)}
body.open .panel.l{transform:translateX(-101%)}
body.open .panel.r{transform:translateX(101%)}
body.open .gate{pointer-events:none;visibility:hidden;transition:visibility 0s 2s}

@media (prefers-reduced-motion:reduce){
 body.open .lit{animation:none;-webkit-mask-position:0 0;mask-position:0 0}
 body.open .signcover{animation:none;opacity:0}
 .fx,.sheen,.n30,.hint{animation:none!important}
 .panel{transition-duration:.01s;transition-delay:0s}
}
</style>
</head>
<body>
<div class="frame" role="img" aria-label="Invito di Luigi per i suoi trent'anni, Chapter 30, 5 dicembre 2026. Good sushi, good wine, good vibes. Dress code elegant.">
  <div class="layer dim"></div>
  <div class="layer lit"></div>
  <div class="fx tube"></div>
  <div class="fx candle"></div>
  <div class="fx name"></div>
  <div class="signcover"></div>
  <div class="fx sglow"></div>
  <div class="cardbox"><div class="sheen"></div></div>
</div>
<canvas id="c" aria-hidden="true"></canvas>

<button class="gate" id="gate" aria-label="Apri l'invito">
  <div class="panel l"></div><div class="panel r"></div>
  <div class="seal"><div class="who">Luigi ti aspetta</div><div class="n30">30</div><div class="hint">Tocca per aprire</div></div>
</button>

<script>
(function(){
  var c=document.getElementById('c'),x=c.getContext('2d'),W,H,P=[],d=Math.min(devicePixelRatio||1,2),run=false;
  function size(){W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
  addEventListener('resize',size);size();
  function mk(burst){return{x:burst?W/2:Math.random()*W,y:burst?H/2:H+10,vx:(Math.random()-.5)*(burst?7:.5),
   vy:burst?(Math.random()-.7)*7:-(.3+Math.random()*.8),r:.5+Math.random()*1.5,a:.25+Math.random()*.6,l:1,b:burst}}
  for(var i=0;i<34;i++){var p=mk();p.y=Math.random()*H;P.push(p)}
  function tick(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];
      p.x+=p.vx+Math.sin((p.y+i*9)/40)*.2;p.y+=p.vy;
      if(p.b){p.l-=.014;p.vy+=.06;p.vx*=.985}
      var al=p.b?Math.max(p.l,0):p.a*Math.min(1,p.y/(H*.3));
      x.beginPath();x.fillStyle='rgba(255,'+(150+Math.floor(p.r*30))+',90,'+al+')';
      x.shadowColor='#ff8a3d';x.shadowBlur=8;x.arc(p.x,p.y,p.r,0,6.283);x.fill();
      if(p.y<-10||(p.b&&p.l<=0)){if(p.b){P.splice(i,1);i--}else P[i]=mk()}
    }
    requestAnimationFrame(tick)
  }
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!still)tick();
  document.getElementById('gate').addEventListener('click',function(){
    document.body.classList.add('open');
    if(still)return;
    for(var i=0;i<80;i++)P.push(mk(true));
    if(navigator.vibrate){try{navigator.vibrate(30)}catch(e){}}
  });
})();
</script>
